
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#17191D">
  <title>Minhas Finanças</title>

  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/global.css">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Barbearia WJ">

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #17191D;
    }

    body.financas-pessoais-page {
      overflow: hidden;
    }

    body.financas-pessoais-page .layout,
    body.financas-pessoais-page .main,
    body.financas-pessoais-page .content {
      display: block;
      width: 100%;
      max-width: none;
      height: 100dvh;
      min-height: 0;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }

    .personal-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #17191D;
    }

    [hidden] {
      display: none !important;
    }

    .personal-loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;

      width: 100%;
      height: 100%;
      padding: 24px;

      background: #17191D;
      color: #ADB0B7;

      font: 14px/1.6 system-ui, sans-serif;
      text-align: center;
    }

    .personal-loading strong {
      color: #F28C28;
      font-size: 21px;
    }

    .personal-retry {
      margin-top: 8px;
      min-height: 43px;
      padding: 10px 19px;

      border: 1px solid #F28C28;
      border-radius: 10px;

      background: #F28C28;
      color: #17191D;

      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
  </style>

  <script defer src="js/global.js"></script>
  <script defer src="js/pwa.js"></script>
</head>

<body class="financas-pessoais-page">
  <div class="layout">
    <main class="main">
      <div class="content">

        <div
          class="personal-loading"
          id="personalLoading"
          role="status"
          aria-live="polite"
        >
          <strong>Minhas Finanças</strong>

          <span id="personalLoadingMessage">
            Verificando acesso...
          </span>

          <button
            type="button"
            id="personalRetry"
            class="personal-retry"
            hidden
          >
            Tentar novamente
          </button>
        </div>

        <iframe
          id="personalFrame"
          class="personal-frame"
          title="Minhas Finanças Pessoais"
          hidden
        ></iframe>

      </div>
    </main>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const frame = document.getElementById("personalFrame");
      const loading = document.getElementById("personalLoading");
      const mensagem = document.getElementById("personalLoadingMessage");
      const retry = document.getElementById("personalRetry");

      async function iniciar() {
        retry.hidden = true;
        loading.hidden = false;
        frame.hidden = true;

        mensagem.textContent = "Verificando acesso...";

        try {
          if (
            !window.WJ ||
            typeof WJ.verificarSessao !== "function"
          ) {
            throw new Error(
              "O arquivo js/global.js não foi carregado corretamente."
            );
          }

          const usuario = await WJ.verificarSessao();

          if (!usuario) {
            window.location.replace("index.html");
            return;
          }

          mensagem.textContent = "Abrindo seu painel financeiro...";

          frame.onload = () => {
            loading.hidden = true;
            frame.hidden = false;
          };

          frame.onerror = () => {
            mensagem.textContent =
              "Não foi possível carregar pessoal-app.html.";
            retry.hidden = false;
          };

          frame.src = "pessoal-app.html";

        } catch (erro) {
          console.error("Erro em Minhas Finanças:", erro);

          mensagem.textContent =
            erro.message ||
            "Não foi possível abrir Minhas Finanças.";

          retry.hidden = false;
        }
      }

      retry.addEventListener("click", iniciar);

      iniciar();
    });
  </script>
</body>
</html>
