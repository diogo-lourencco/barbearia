
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Login | Barbearia WJ</title>

  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">

  <link rel="stylesheet" href="css/login.css">

  <!-- Instalação no iPhone / PWA -->
  <link rel="manifest" href="manifest.webmanifest">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >
  <meta
    name="apple-mobile-web-app-title"
    content="Barbearia WJ"
  >
  <meta name="theme-color" content="#17191D">

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="assets/icon-180.png"
  >

  <script src="js/global.js" defer></script>
  <script src="js/login.js" defer></script>
  <script src="js/pwa.js" defer></script>
</head>

<body>

  <main class="login">

    <form id="loginForm" class="login-card">

      <div class="login-logo">
        <img
          src="assets/logo.png"
          alt="Logo da Barbearia WJ"
        >
      </div>

      <h1>Bem-vindo</h1>

      <p class="subtitle">
        Entre para acessar seu painel.
      </p>

      <!-- USUÁRIO -->
      <div class="field">

        <label for="username">
          Usuário
        </label>

        <input
          type="text"
          id="username"
          name="username"
          placeholder="Digite seu usuário"
          autocomplete="username"
          maxlength="180"
          spellcheck="false"
          autocapitalize="none"
          required
        >

      </div>

      <!-- SENHA -->
      <div class="field">

        <label for="password">
          Senha
        </label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required
        >

      </div>

      <!-- MOSTRAR SENHA -->
      <label class="show-password">

        <input
          type="checkbox"
          id="showPassword"
        >

        Mostrar senha

      </label>

      <!-- MENSAGENS -->
      <p
        id="loginMessage"
        role="alert"
        aria-live="polite"
        hidden
        style="
          color:#f87171;
          text-align:center;
          margin:12px 0;
        "
      ></p>

      <!-- ENTRAR -->
      <button
        type="submit"
        id="loginButton"
        class="login-button"
      >
        Entrar no sistema
      </button>

    </form>

  </main>

</body>
</html>
